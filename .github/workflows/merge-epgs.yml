name: Merge EPGs

on:
  schedule:
    # 17:30 UTC: después de las 18:00 CET, cuando open-epg ya generó las guías del día (su FAQ
    # pide bajarlas una vez por día a partir de esa hora; ver planes/licencias-fuentes-epg.md).
    - cron: '30 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Una sola corrida a la vez, en orden. Si se lanza otra (desde la interfaz, el cron o un merge)
# mientras una sigue en marcha, queda en cola y arranca cuando esa termina; si ya había una en
# cola, GitHub se queda con la más nueva (que trae el código y el xtream_channel_map.json más
# recientes). Al correr en orden, la última en terminar es siempre la más nueva: una corrida
# vieja ya no puede pisar la branch `data` con resultados desactualizados (pasó el 27/09).
concurrency:
  group: merge-epgs
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    # Una corrida normal tarda ~8 min. Con las corridas en cola, una trabada no puede
    # bloquear a las siguientes por horas (el límite por defecto de GitHub es 6 h).
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: '1'  # el log muestra el avance en vivo, no todo junto al final

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run tests
      run: python -m pytest tests/ -q

    - name: Merge EPGs
      run: python merge_epgs.py

    # Diccionario de canales de iptv-org (dominio público): nombres alternativos para los
    # canales que no encuentran guía por su nombre (channel_db.py). Si no se puede bajar, la
    # corrida sigue sin él.
    - name: Download channel dictionary
      continue-on-error: true
      run: curl -sSfL --retry 3 -o iptv_channels.json https://iptv-org.github.io/api/channels.json

    # Genera, por cada perfil de XTREAM_PROFILES, su out/<perfil>/{playlist.m3u8,epg.xml.gz,match_report.json}.
    # El JSON con las credenciales nunca se expande en el shell: lo lee el propio Python.
    - name: Generate playlists
      env:
        XTREAM_PROFILES: ${{ secrets.XTREAM_PROFILES }}
        XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
        XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        XTREAM_SERVERS: ${{ secrets.XTREAM_SERVERS }}
        XTREAM_GIST_ID: ${{ secrets.XTREAM_GIST_ID }}
      run: python generate_playlist.py

    # Qué tan bien asigna el EPG el matcher en listas públicas que no son del proveedor de este
    # repo (bench/, ver tools/match_benchmark.py). Informativo: queda en el log de cada corrida.
    - name: Matcher benchmark
      continue-on-error: true
      timeout-minutes: 5
      run: python tools/match_benchmark.py --errors 3

    # @grilla/core (el matcher en TypeScript, core/) contra el de Python con la guía y las listas
    # reales de esta corrida: tienen que elegir exactamente lo mismo. Informativo.
    - uses: actions/setup-node@v4
      continue-on-error: true
      with:
        node-version: '22'
    - name: Core parity (TypeScript vs Python)
      continue-on-error: true
      timeout-minutes: 10
      run: |
        report=$(ls out/*/match_report.json 2>/dev/null | head -1)
        python tools/core_parity.py ${report:+--luis "$report"} --out /tmp/parity.json
        node core/test/parity.ts /tmp/parity.json --show 10

    # Uso de cada fuente de EPG y fuentes sugeridas para los canales sin guía (baja hasta 20
    # candidatas del catálogo para medirlas). Es informativo para la interfaz: si falla, la
    # corrida sigue igual.
    - name: Source coverage report
      continue-on-error: true
      timeout-minutes: 10
      run: python tools/source_coverage.py

    # Guía compartida para Grilla web (Etapa 1) en Cloudflare R2: índice de la guía para
    # @grilla/core y los datos de la interfaz. Sin los secretos R2_* no hace nada; si falla,
    # la corrida sigue igual (lo de GitHub no depende de esto).
    - name: Publish shared guide to R2
      continue-on-error: true
      timeout-minutes: 15
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET: ${{ vars.R2_BUCKET }}
      run: |
        python shared_guide.py
        bash tools/r2_upload.sh

    # Al release público solo van artefactos SIN credenciales adentro. Las playlists llevan
    # usuario y contraseña dentro de cada URL de stream, así que van a un gist secreto por
    # persona (paso siguiente) y nunca acá.
    - name: Publish public assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG=latest
        if ! gh release view "$TAG" >/dev/null 2>&1; then
          gh release create "$TAG" --title "EPG mergeado (auto)" \
            --notes "Se actualiza automáticamente en cada corrida del workflow."
        fi
        gh release upload "$TAG" merged.xml.gz --clobber
        [ -f out/epg_catalog.json ] && gh release upload "$TAG" out/epg_catalog.json --clobber
        for dir in out/*/; do
          [ -f "$dir/epg.xml.gz" ] || continue
          name=$(basename "$dir")
          cp "$dir/epg.xml.gz" "epg-$name.xml.gz"
          gh release upload "$TAG" "epg-$name.xml.gz" --clobber
          # match_report.json no lleva URLs de stream ni credenciales: es seguro publicarlo.
          # Sirve para bajarlo con `gh release download`/`gh api` al diagnosticar matching.
          cp "$dir/match_report.json" "match_report-$name.json"
          gh release upload "$TAG" "match_report-$name.json" --clobber
        done

    # La interfaz de corrección (docs/) necesita leer epg_catalog.json y los match_report
    # desde el navegador, y los assets de un release se sirven vía un redirect a Azure Blob
    # que NO manda cabecera CORS (confirmado con curl) — fetch() los bloquea. raw.githubusercontent.com
    # sí manda `Access-Control-Allow-Origin: *`, así que estos mismos archivos (sin credenciales)
    # se publican además en una branch `data` aparte, con force-push para no acumular historia
    # (es contenido que se reemplaza entero en cada corrida, no algo para versionar).
    - name: Publish data branch for the EPG-correction UI
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        rm -rf /tmp/data-branch && mkdir /tmp/data-branch
        [ -f out/epg_catalog.json ] && cp out/epg_catalog.json /tmp/data-branch/
        [ -f out/epg_icons.json ] && cp out/epg_icons.json /tmp/data-branch/
        [ -f provider_rules.json ] && cp provider_rules.json /tmp/data-branch/
        [ -f out/sources_report.json ] && cp out/sources_report.json /tmp/data-branch/
        [ -d out/schedule ] && cp -r out/schedule /tmp/data-branch/schedule
        for dir in out/*/; do
          [ -f "$dir/match_report.json" ] || continue
          name=$(basename "$dir")
          cp "$dir/match_report.json" "/tmp/data-branch/match_report-$name.json"
        done
        cd /tmp/data-branch
        git init -q -b data
        git config user.email "actions@github.com"
        git config user.name "github-actions"
        git add -A
        git commit -q -m "Actualizar datos para la interfaz de corrección de EPG"
        git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data:data

    # No-op si falta GIST_TOKEN: el script lo avisa y sale sin error.
    - name: Publish playlists to secret gists
      env:
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        XTREAM_PROFILES: ${{ secrets.XTREAM_PROFILES }}
        XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
        XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        XTREAM_SERVERS: ${{ secrets.XTREAM_SERVERS }}
        XTREAM_GIST_ID: ${{ secrets.XTREAM_GIST_ID }}
      run: python publish_playlists.py

    # El reporte de matching no lleva URLs de stream, así que es seguro guardarlo; sirve para
    # diffear la calidad del matching entre corridas.
    - name: Upload match reports
      uses: actions/upload-artifact@v4
      with:
        name: match-reports
        path: out/*/match_report.json
        if-no-files-found: ignore
