name: Merge EPGs

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Merge EPGs
      run: python merge_epgs.py
    
    - name: Commit and push
      run: |
        FILE_SIZE_BYTES=$(stat -c%s merged.xml.gz)
        MAX_GITHUB_FILE_SIZE_BYTES=100000000

        if [ "$FILE_SIZE_BYTES" -gt "$MAX_GITHUB_FILE_SIZE_BYTES" ]; then
          echo "⚠️ merged.xml.gz is larger than 100 MB (${FILE_SIZE_BYTES} bytes). Skipping commit/push."
          exit 0
        fi

        git config user.name "EPG Bot"
        git config user.email "bot@github.com"
        git add merged.xml.gz
        git commit -m "Update EPG - $(date)" || echo "No changes"
        git push
