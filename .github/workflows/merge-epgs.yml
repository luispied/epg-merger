name: Merge EPGs

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Merge EPGs
      run: python merge_epgs.py

    - name: Generate Xtream playlist
      if: ${{ secrets.XTREAM_USERNAME != '' }}
      env:
        XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
        XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        XTREAM_SERVERS: ${{ secrets.XTREAM_SERVERS }}
      run: python generate_playlist.py

    - name: Publish release asset
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG=latest
        if ! gh release view "$TAG" >/dev/null 2>&1; then
          gh release create "$TAG" --title "EPG mergeado (auto)" --notes "Se actualiza automáticamente en cada corrida del workflow."
        fi
        gh release upload "$TAG" merged.xml.gz --clobber
        [ -f playlist.m3u8 ] && gh release upload "$TAG" playlist.m3u8 --clobber || true
        [ -f my_epg.xml.gz ] && gh release upload "$TAG" my_epg.xml.gz --clobber || true
