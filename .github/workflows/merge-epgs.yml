name: Merge EPGs

on:
  schedule:
    # 17:30 UTC: después de las 18:00 CET, cuando open-epg ya generó las guías del día (su FAQ
    # pide bajarlas una vez por día a partir de esa hora; ver planes/licencias-fuentes-epg.md).
    - cron: '30 17 * * *'
  workflow_dispatch:
    inputs:
      ai_muestras:
        description: 'Prueba de la IA: cuántos programas clasificar y mostrar (0 = nada)'
        default: '0'

permissions:
  contents: write

# Una sola corrida a la vez, en orden. Si se lanza otra (desde la interfaz, el cron o un merge)
# mientras una sigue en marcha, queda en cola y arranca cuando esa termina; si ya había una en
# cola, GitHub se queda con la más nueva (que trae el código y el xtream_channel_map.json más
# recientes). Al correr en orden, la última en terminar es siempre la más nueva: una corrida
# vieja ya no puede pisar la branch `data` con resultados desactualizados (pasó el 27/09).
concurrency:
  group: merge-epgs
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    # Una corrida normal tarda ~8 min (más hasta 20 si la IA espera su lote). Con las corridas en
    # cola, una trabada no puede bloquear a las siguientes por horas (el límite de GitHub es 6 h).
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'  # el log muestra el avance en vivo, no todo junto al final

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt boto3

    - name: Run tests
      run: python -m pytest tests/ -q

    # Fuentes automáticas (tools/auto_sources.py): las que activó la corrida anterior según lo que
    # les falta a las listas. Sin R2 o si falla, se fusiona solo lo de epg_urls.json.
    - name: Pull auto sources
      continue-on-error: true
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET: ${{ vars.R2_BUCKET }}
      run: python tools/auto_sources.py pull

    - name: Merge EPGs
      run: python merge_epgs.py

    # Diccionario de canales de iptv-org (dominio público): nombres alternativos para los
    # canales que no encuentran guía por su nombre (channel_db.py). Si no se puede bajar, la
    # corrida sigue sin él.
    - name: Download channel dictionary
      continue-on-error: true
      run: curl -sSfL --retry 3 -o iptv_channels.json https://iptv-org.github.io/api/channels.json

    # Arma lo compartido de toda la guía a partir de la guía fusionada: el catálogo y la programación que
    # usa Grilla web (de ahí cuelgan la Guía y Tu plan de todos). No necesita ninguna credencial.
    # Opcional: si hay perfiles en XTREAM_PROFILES (o XTREAM_USERNAME/PASSWORD/SERVERS), también cruza la
    # guía con la lista de cada uno y deja su match_report (out/<perfil>/), que usan los bancos de pruebas.
    # Las playlists que escribe no se publican: las que usa el reproductor las arma el Worker.
    # El JSON con las credenciales nunca se expande en el shell: lo lee el propio Python.
    - name: Generate playlists
      env:
        XTREAM_PROFILES: ${{ secrets.XTREAM_PROFILES }}
        XTREAM_USERNAME: ${{ secrets.XTREAM_USERNAME }}
        XTREAM_PASSWORD: ${{ secrets.XTREAM_PASSWORD }}
        XTREAM_SERVERS: ${{ secrets.XTREAM_SERVERS }}
      run: python generate_playlist.py

    # Qué tan bien asigna el EPG el matcher en listas públicas que no son del proveedor de este
    # repo (bench/, ver tools/match_benchmark.py). Informativo: queda en el log de cada corrida.
    - name: Matcher benchmark
      continue-on-error: true
      timeout-minutes: 5
      run: python tools/match_benchmark.py --errors 3

    # @grilla/core (el matcher en TypeScript, core/) contra el de Python con la guía y las listas
    # reales de esta corrida: tienen que elegir exactamente lo mismo. Informativo.
    - uses: actions/setup-node@v4
      continue-on-error: true
      with:
        node-version: '22'
    - name: Core parity (TypeScript vs Python)
      continue-on-error: true
      timeout-minutes: 10
      run: |
        report=$(ls out/*/match_report.json 2>/dev/null | head -1)
        python tools/core_parity.py ${report:+--luis "$report"} --out /tmp/parity.json
        node core/test/parity.ts /tmp/parity.json --show 10

    # Uso de cada fuente de EPG y fuentes sugeridas para los canales sin guía (baja hasta 20
    # candidatas del catálogo para medirlas). Es informativo para la interfaz: si falla, la
    # corrida sigue igual.
    - name: Source coverage report
      continue-on-error: true
      timeout-minutes: 10
      run: python tools/source_coverage.py

    # Activa fuentes del catálogo para los países que les faltan a las listas (perfiles y
    # configuraciones de Grilla web) y retira las que nadie usa. Entran en la corrida siguiente.
    - name: Update auto sources
      continue-on-error: true
      timeout-minutes: 10
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET: ${{ vars.R2_BUCKET }}
      run: python tools/auto_sources.py update

    # Guía compartida para Grilla web (Etapa 1) en Cloudflare R2: índice de la guía para
    # @grilla/core y los datos de la interfaz. Sin los secretos R2_* no hace nada; si falla,
    # la corrida sigue igual (lo de GitHub no depende de esto).
    - name: Publish shared guide to R2
      continue-on-error: true
      timeout-minutes: 15
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET: ${{ vars.R2_BUCKET }}
      run: |
        python shared_guide.py
        bash tools/r2_upload.sh

    # Cuánto costaría clasificar la guía por género con IA (planes/recomendaciones.md, fase 2): cuenta
    # los títulos nuevos de cada día y proyecta el costo mensual, sin llamar a ninguna IA. Informativo:
    # queda en el resumen de la corrida y en ai/measure.json de R2.
    - name: Measure titles for AI (free)
      continue-on-error: true
      timeout-minutes: 5
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET: ${{ vars.R2_BUCKET }}
      run: python tools/measure_titles.py

    # Al release solo van artefactos SIN credenciales adentro: la guía fusionada, que baja
    # tools/refresh_epgs.py para armar la guía de cada configuración, y el catálogo de EPG.
    - name: Publish release assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG=latest
        if ! gh release view "$TAG" >/dev/null 2>&1; then
          gh release create "$TAG" --title "EPG mergeado (auto)" \
            --notes "Se actualiza automáticamente en cada corrida del workflow."
        fi
        gh release upload "$TAG" merged.xml.gz --clobber
        [ -f out/epg_catalog.json ] && gh release upload "$TAG" out/epg_catalog.json --clobber
        true

    # El reporte de matching no lleva URLs de stream, así que es seguro guardarlo; sirve para
    # diffear la calidad del matching entre corridas.
    - name: Upload match reports
      uses: actions/upload-artifact@v4
      with:
        name: match-reports
        path: |
          out/*/match_report.json
          out/sources_report.json
        if-no-files-found: ignore

    # Clasificar con IA (tools/classify_genres.py, planes/ia-tu-plan.md). Solo con el interruptor
    # prendido (variable del repo AI_CLASSIFY = on) o en una prueba pedida a mano con ai_muestras.
    # Va al final: si el lote tarda, la guía ya se publicó. Sin ANTHROPIC_API_KEY no hace nada.
    - name: Classify titles with AI
      if: vars.AI_CLASSIFY == 'on' || (github.event_name == 'workflow_dispatch' && inputs.ai_muestras != '0')
      continue-on-error: true
      timeout-minutes: 25
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        AI_CLASSIFY: ${{ vars.AI_CLASSIFY }}
        AI_SAMPLE: ${{ inputs.ai_muestras }}
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET: ${{ vars.R2_BUCKET }}
      run: |
        pip install anthropic
        python tools/classify_genres.py

    - name: Upload AI samples
      if: github.event_name == 'workflow_dispatch' && inputs.ai_muestras != '0'
      uses: actions/upload-artifact@v4
      with:
        name: ia-muestras
        path: out/ai_sample.html
        if-no-files-found: ignore
