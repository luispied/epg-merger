name: Delete Grilla short links

# Borra todos los links cortos de reproducción de Grilla web (tools/delete_short_links.py).
# Hay que volver a generarlos desde "Tus links". Se corre a mano y pide escribir BORRAR.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribí BORRAR para confirmar'
        required: true

permissions:
  contents: read

jobs:
  delete:
    if: ${{ inputs.confirm == 'BORRAR' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -r requirements.txt boto3
    - name: Delete
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET: ${{ vars.R2_BUCKET }}
      run: python tools/delete_short_links.py
