name: Check worker

# Worker de Grilla (worker/): tipos, tests y la web compilada. La publicación la hace Cloudflare Workers Builds.
# Sin filtro de ruta en PRs: el check «worker» es requerido en main y tiene que reportar en todo PR.
on:
  pull_request:
  push:
    branches: [main]
    paths: ['worker/**', 'core/**', '.github/workflows/check-worker.yml']

permissions:
  contents: read

# Un push nuevo a un PR cancela la corrida anterior del mismo PR: no se apilan minutos en commits que ya no valen.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: worker/package-lock.json
    - name: Dependencias
      working-directory: worker
      run: npm ci --no-audit --no-fund
    - name: Type-check (Worker y web)
      run: |
        npx --yes -p typescript@5.9 tsc -p worker --noEmit
        npx --yes -p typescript@5.9 tsc -p worker/web --noEmit
    - name: Build the web (como Cloudflare antes de publicar)
      working-directory: worker
      run: node build.mjs
    - name: Tests
      run: node --test worker/test/*.test.ts
    - name: Caché del navegador de Playwright
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: pw-${{ hashFiles('worker/package-lock.json') }}
    - name: Tests de humo de la web (Playwright)
      working-directory: worker
      # En los PR, solo el humo: la alta, el modo ver, la primera carga y la pantalla de inicio. En main (push) corre el
      # resto de la suite: esas cuatro ya pasaron en el PR, así que no se repiten; de la primera carga solo queda la
      # prueba lenta (el pedido que no contesta, ~1 min), con SLOW=1.
      env:
        SLOW: ${{ github.event_name == 'push' && '1' || '' }}
        EVENT: ${{ github.event_name }}
      run: |
        npx playwright install --with-deps chromium
        if [ "$EVENT" = "pull_request" ]; then
          npx playwright test e2e/smoke.spec.ts e2e/alta.spec.ts e2e/ver.spec.ts e2e/primera-carga.spec.ts
        else
          rest=$(ls e2e/*.spec.ts | grep -v -E '/(smoke|alta|ver|primera-carga)\.spec\.ts$')
          npx playwright test $rest
          npx playwright test e2e/primera-carga.spec.ts -g "un pedido que no contesta"
        fi
    - name: Punta a punta contra el Worker real (solo en main)
      # wrangler dev con R2 local (worker/e2e-real/): el Worker de verdad, sin simulaciones. Solo en main, como la suite
      # completa: en los PR no corre.
      if: github.event_name == 'push'
      working-directory: worker
      run: npm run e2e:real

  # Prueba de capturas (worker/e2e/visual.spec.ts): las pantallas principales de main y del PR, sacadas en esta misma
  # máquina con la misma prueba (la del PR), y comparadas. No hay capturas guardadas en el repo. Es informativa: no
  # frena el PR; si algo cambió a la vista, el resumen lo dice y las diferencias quedan en el artifact «capturas».
  visual:
    # Solo con la etiqueta «visual» en el PR (o en main): es informativa y gasta minutos (compila main y el PR).
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'visual')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Capturas de main (con la prueba del PR)
      working-directory: base/worker
      run: |
        cp ../../worker/playwright.config.ts .
        cp ../../worker/e2e/visual.spec.ts ../../worker/e2e/fake-worker.ts ../../worker/e2e/serve.mjs e2e/
        npm ci --no-audit --no-fund
        node build.mjs
        npx playwright install --with-deps chromium
        VISUAL=1 SNAP_DIR="$RUNNER_TEMP/snap" npx playwright test e2e/visual.spec.ts --update-snapshots --reporter=line
    - name: Capturas del PR, comparadas
      working-directory: worker
      run: |
        npm ci --no-audit --no-fund
        node build.mjs
        code=0
        VISUAL=1 SNAP_DIR="$RUNNER_TEMP/snap" npx playwright test e2e/visual.spec.ts --reporter=line || code=$?
        n=$(find test-results -name '*-diff.png' 2>/dev/null | wc -l)
        {
          echo "## Prueba de capturas"
          if [ "$n" -eq 0 ] && [ "$code" -eq 0 ]; then echo "Ninguna pantalla cambió a la vista respecto de main."
          elif [ "$n" -eq 0 ]; then echo "La prueba falló antes de comparar (una pantalla no llegó a abrirse): ver el log de este paso."
          else
            echo "**$n capturas cambiaron** respecto de main (las diferencias, en el artifact «capturas»):"
            find test-results -name '*-diff.png' | sed -E 's|.*-(iphone\|escritorio)/(.*)-diff\.png|- \2 (\1)|' | sort
          fi
        } >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: capturas
        path: worker/test-results/**/*.png
        if-no-files-found: ignore
