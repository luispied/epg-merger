name: Check worker

# Worker de Grilla (worker/): tipos, tests y la web compilada. La publicación la hace Cloudflare Workers Builds.
on:
  pull_request:
    paths: ['worker/**', 'core/**', 'docs/app.css', 'docs/icons.js', '.github/workflows/check-worker.yml']
  push:
    branches: [main]
    paths: ['worker/**', 'core/**', 'docs/app.css', 'docs/icons.js', '.github/workflows/check-worker.yml']

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Type-check (Worker y web)
      run: |
        npx --yes -p typescript@5.9 tsc -p worker --noEmit
        npx --yes -p typescript@5.9 tsc -p worker/web --noEmit
    - name: Build the web (como Cloudflare antes de publicar)
      working-directory: worker
      run: npm ci --no-audit --no-fund && node build.mjs
    - name: Tests
      run: node --test worker/test/*.test.ts
