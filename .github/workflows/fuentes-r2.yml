name: Subir fuentes a R2

# Sube a R2 (privado) las fuentes de guía que están en el repo. Se corre a mano, una vez, antes de sacarlas del repo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - run: pip install boto3
    - name: Subir epg_urls.json y epg_sources_catalog.json
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET: ${{ vars.R2_BUCKET }}
      run: python tools/fuentes_r2.py push epg_urls.json epg_sources_catalog.json
