name: Sinopsis de TMDB

# Busca en TMDB (español) las sinopsis de las películas y series de la guía y las guarda en R2 como
# desc/sinopsis.json (tools/sinopsis_tmdb.py). Es acumulativo: cada corrida avanza con títulos nuevos.
# Manual por ahora. No toca los links de reproducción (short/, devices/).
on:
  workflow_dispatch:
    inputs:
      max:
        description: 'Búsquedas nuevas por corrida'
        default: '3000'
        required: false

permissions:
  contents: read

jobs:
  sinopsis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install boto3
    - name: Bajar la guía publicada
      run: gh release download latest --pattern merged.xml.gz --dir medicion --clobber
    - name: Buscar sinopsis
      run: python tools/sinopsis_tmdb.py --xmltv medicion/merged.xml.gz --max '${{ inputs.max }}' | tee -a "$GITHUB_STEP_SUMMARY"
