name: Discover EPG sources

# Una vez por semana recorre los proveedores públicos de EPG y repos sueltos, prueba cada archivo y actualiza el catálogo en
# R2 (privado, fuentes/): qué fuentes existen, de qué país son y si están al día (fresh), abandonadas (stale) o
# caídas (down). epg_urls.json puede referenciar estas fuentes solo por id.
on:
  schedule:
    - cron: '17 6 * * 1'   # lunes 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discover-sources
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - run: pip install -r requirements.txt
    - name: Discover and evaluate sources
      run: python tools/discover_epg_sources.py --out "$RUNNER_TEMP/epg_sources_catalog.json"
    - name: Subir el catálogo a R2 (privado, no se commitea)
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET: ${{ vars.R2_BUCKET }}
      run: |
        pip install boto3
        python tools/fuentes_r2.py push "$RUNNER_TEMP/epg_sources_catalog.json"
