name: Check UI

# Chequeo de tipos de la interfaz de corrección (docs/). No compila nada: app.js es JavaScript
# con tipos en comentarios (JSDoc + // @ts-check) y GitHub Pages lo sirve tal cual.
on:
  pull_request:
    paths: ['docs/**', '.github/workflows/check-ui.yml']
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/check-ui.yml']

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Type-check docs/app.js
      run: npx --yes -p typescript@5.9 tsc -p docs
    - name: Syntax-check the service worker
      run: node --check docs/sw.js
    - name: Asset versions match the service worker cache
      # index.html pide app.css/app.js/icons.js con ?v=N; tiene que ser el mismo N que el
      # CACHE de sw.js, si no el HTML nuevo puede cargar un JS viejo de la caché del navegador.
      run: |
        cache=$(grep -oP "CACHE = 'epg-ui-v\K\d+" docs/sw.js)
        bad=$(grep -oP '(app\.css|app\.js|icons\.js)\?v=\K\d+' docs/index.html | grep -vx "$cache" || true)
        count=$(grep -cP '(app\.css|app\.js|icons\.js)\?v=' docs/index.html)
        if [ -n "$bad" ] || [ "$count" -ne 3 ]; then
          echo "::error::index.html tiene que pedir app.css, app.js e icons.js con ?v=$cache (CACHE de sw.js)"; exit 1
        fi
