name: Refresh Grilla guides

# Guía de las configuraciones nuevas o cambiadas (tools/refresh_epgs.py), con la guía fusionada de la última corrida
# diaria. Sin credenciales del proveedor: la lista y la prueba de canales las hace el Worker por el relay (relay/).
# Corre cada 3 horas y, además, cuando el Worker la pide (configuración nueva o editada: worker/src/github.ts). El
# archivo conserva su nombre para que un Worker publicado antes que este cambio la siga encontrando.
on:
  schedule:
    - cron: '12 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-lists
  cancel-in-progress: false

jobs:
  guides:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -r requirements.txt boto3
    - name: Build guides for new or changed configs
      env:
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET: ${{ vars.R2_BUCKET }}
        # Para bajar merged.xml.gz del release aunque el repo sea privado.
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: python tools/refresh_epgs.py
