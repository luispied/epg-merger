<script>
  try {
    var t = localStorage.getItem('grilla_theme') || 'dark';
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    // Texto grande: el mismo ajuste que la edición (la barra inferior mide y queda igual en los dos).
    if (localStorage.getItem('grilla_text') === 'lg') document.documentElement.dataset.text = 'lg';
    if (sessionStorage.getItem('nowline_splash') || navigator.webdriver) document.documentElement.classList.add('no-splash');
    else sessionStorage.setItem('nowline_splash', '1');
  } catch (e) { /* sin storage: sigue al sistema */ }
</script>
