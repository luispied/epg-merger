# Worker de Grilla (Etapa 1): configuraciones, links de reproducción y guía desde R2.
# Se publica solo con Cloudflare Workers Builds (repo conectado, carpeta worker/).
# Secreto: TOKEN_KEY (32 bytes en base64), en el panel del Worker → Settings → Variables.
name = "grilla"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Las variables cargadas en el panel no se borran al publicar desde el repo.
keep_vars = true

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "grilla"

[observability]
enabled = true
