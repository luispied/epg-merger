# Worker de Grilla (Etapa 1): configuraciones, links de reproducción y guía desde R2.
# Se publica solo con Cloudflare Workers Builds (repo conectado, carpeta worker/).
# Secreto: TOKEN_KEY (32 bytes en base64), en el panel del Worker → Settings → Variables.
name = "grilla"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Las variables cargadas en el panel no se borran al publicar desde el repo.
keep_vars = true

# La web (web/ → public/, ver build.mjs). Los archivos se sirven antes que el Worker: las
# rutas /api, /p y /s no chocan con ninguno.
[build]
command = "npm install --no-audit --no-fund && node build.mjs"

[assets]
directory = "./public"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "grilla"

[observability]
enabled = true
